[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biopharma-postprocess"
version = "0.2.0"
description = "Modular peptide-mapping post-processing for Thermo BioPharma Finder exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1,<3",
  "streamlit>=1.38,<2",
  "plotly>=5.20,<7",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bpf-postprocess = "bpf_postprocess.cli:main"
bpf-validate-pmf = "bpf_postprocess.validation_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
